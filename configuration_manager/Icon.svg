<svg width="200" height="200" viewBox="0 0 200 200"
    xmlns="http://www.w3.org/2000/svg">
    <!-- Base frame -->
    <rect x="40" y="40" width="120" height="120" rx="12" ry="12" stroke="#000" stroke-width="8" fill="none"/>

    <!-- Signal lines representing control -->
    <line x1="60" y1="60" x2="140" y2="60" stroke="#000" stroke-width="8" stroke-linecap="square"/>
    <line x1="60" y1="100" x2="140" y2="100" stroke="#000" stroke-width="8" stroke-linecap="square"/>
    <line x1="60" y1="140" x2="140" y2="140" stroke="#000" stroke-width="8" stroke-linecap="square"/>

    <!-- Connection nodes -->
    <circle cx="60" cy="60" r="10" fill="#000"/>
    <circle cx="140" cy="60" r="10" fill="#000"/>
    <circle cx="60" cy="100" r="10" fill="#000"/>
    <circle cx="140" cy="100" r="10" fill="#000"/>
    <circle cx="60" cy="140" r="10" fill="#000"/>
    <circle cx="140" cy="140" r="10" fill="#000"/>

    <!-- Central control hub -->
    <rect x="90" y="90" width="20" height="20" fill="#000"/>
</svg>
